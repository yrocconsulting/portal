name: Database migrations

# Applies new files in supabase/migrations to the production Supabase project.
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

concurrency: db-migrate

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::notice::Supabase secrets are not set yet; skipping migrations."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - uses: supabase/setup-cli@v1
        if: env.SKIP != '1'
        with:
          version: latest
      - name: Apply migrations
        if: env.SKIP != '1'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push
